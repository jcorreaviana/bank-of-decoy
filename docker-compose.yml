services:
  postgres:
    image: postgres:16
    container_name: bank-of-decoy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: bank
      POSTGRES_PASSWORD: bank
      POSTGRES_DB: bank
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bank"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:4.3.1
    container_name: bank-of-decoy-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: controller,broker
      # Dois listeners PLAINTEXT: um so alcancavel de dentro da rede do
      # compose (anunciado como `kafka:9092`, usado pelos servicos entre
      # si) e outro alcancavel do host (`localhost:29092`, usado por
      # pytest/scripts rodando fora do Docker). Sem isso, um cliente rodando
      # DENTRO de um container conecta em `kafka:9092` para o bootstrap,
      # mas a resposta de metadata do broker manda reconectar no endereco
      # anunciado - se so existisse o listener `localhost`, esse segundo
      # passo apontaria o cliente de volta para si mesmo (loopback dentro
      # do proprio container), nunca para o Kafka de fato (issue #7 expos
      # isso: o consumidor do account-service falhava com
      # "Connect to ipv4#127.0.0.1:9092 failed" mesmo com
      # KAFKA_BOOTSTRAP_SERVERS=kafka:9092 configurado corretamente).
      KAFKA_LISTENERS: PLAINTEXT://:9092,PLAINTEXT_HOST://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
    volumes:
      - kafka_data:/var/lib/kafka/data

  onboarding-service:
    # Contexto = raiz do monorepo (nao ./onboarding-service) - o build
    # precisa alcancar shared/risk_engine, dependencia local editable
    # (issue #8). Dockerfile ajustado de acordo (COPY com prefixo).
    build:
      context: .
      dockerfile: onboarding-service/Dockerfile
    container_name: bank-of-decoy-onboarding-service
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      SERVICE_NAME: onboarding-service
      PORT: "8001"
      LOG_LEVEL: INFO
      DATABASE_URL: postgresql://bank:bank@postgres:5432/onboarding
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # Dev-only: mesma chave em onboarding-service e account-service (specs/business/10-criptografia-cpf.md).
      CPF_ENCRYPTION_KEY: ${CPF_ENCRYPTION_KEY}
      # Camada de caos (specs/business/11-camada-caos.md) - toggle
      # independente por servico, prefixo ONBOARDING_ no host para nao
      # colidir com os outros 3 servicos. Desligado por padrao.
      CHAOS_ENABLED: ${ONBOARDING_CHAOS_ENABLED:-false}
      CHAOS_FAILURE_RATE: ${ONBOARDING_CHAOS_FAILURE_RATE:-0.05}
      CHAOS_FAILURE_TYPES: ${ONBOARDING_CHAOS_FAILURE_TYPES:-timeout,503,500,latencia}
    depends_on:
      postgres:
        condition: service_healthy

  account-service:
    # Contexto = raiz do monorepo (nao ./account-service) - o build
    # precisa alcancar shared/test_safety, dependencia local editable
    # (specs/tech/testing.md). Dockerfile ajustado de acordo (COPY com
    # prefixo), mesmo padrao ja usado por onboarding-service/transaction-service.
    build:
      context: .
      dockerfile: account-service/Dockerfile
    container_name: bank-of-decoy-account-service
    restart: unless-stopped
    ports:
      - "8002:8002"
    environment:
      SERVICE_NAME: account-service
      PORT: "8002"
      LOG_LEVEL: INFO
      DATABASE_URL: postgresql://bank:bank@postgres:5432/account
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      ONBOARDING_SERVICE_URL: http://onboarding-service:8001
      CPF_ENCRYPTION_KEY: ${CPF_ENCRYPTION_KEY}
      CHAOS_ENABLED: ${ACCOUNT_CHAOS_ENABLED:-false}
      CHAOS_FAILURE_RATE: ${ACCOUNT_CHAOS_FAILURE_RATE:-0.05}
      CHAOS_FAILURE_TYPES: ${ACCOUNT_CHAOS_FAILURE_TYPES:-timeout,503,500,latencia}
    depends_on:
      postgres:
        condition: service_healthy
      onboarding-service:
        condition: service_started

  pix-key-service:
    # Mesmo motivo do account-service acima: contexto = raiz do monorepo,
    # para alcancar shared/test_safety.
    build:
      context: .
      dockerfile: pix-key-service/Dockerfile
    container_name: bank-of-decoy-pix-key-service
    restart: unless-stopped
    ports:
      - "8003:8003"
    environment:
      SERVICE_NAME: pix-key-service
      PORT: "8003"
      LOG_LEVEL: INFO
      DATABASE_URL: postgresql://bank:bank@postgres:5432/pix_key
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      CHAOS_ENABLED: ${PIX_KEY_CHAOS_ENABLED:-false}
      CHAOS_FAILURE_RATE: ${PIX_KEY_CHAOS_FAILURE_RATE:-0.05}
      CHAOS_FAILURE_TYPES: ${PIX_KEY_CHAOS_FAILURE_TYPES:-timeout,503,500,latencia}
    depends_on:
      postgres:
        condition: service_healthy

  transaction-service:
    # Mesmo motivo do onboarding-service acima: contexto = raiz do
    # monorepo, para alcancar shared/risk_engine (issue #8).
    build:
      context: .
      dockerfile: transaction-service/Dockerfile
    container_name: bank-of-decoy-transaction-service
    restart: unless-stopped
    ports:
      - "8004:8004"
    environment:
      SERVICE_NAME: transaction-service
      PORT: "8004"
      LOG_LEVEL: INFO
      DATABASE_URL: postgresql://bank:bank@postgres:5432/transaction
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      ACCOUNT_SERVICE_URL: http://account-service:8002
      PIX_KEY_SERVICE_URL: http://pix-key-service:8003
      CHAOS_ENABLED: ${TRANSACTION_CHAOS_ENABLED:-false}
      CHAOS_FAILURE_RATE: ${TRANSACTION_CHAOS_FAILURE_RATE:-0.05}
      CHAOS_FAILURE_TYPES: ${TRANSACTION_CHAOS_FAILURE_TYPES:-timeout,503,500,latencia}
    depends_on:
      postgres:
        condition: service_healthy
      account-service:
        condition: service_started
      pix-key-service:
        condition: service_started

  prometheus:
    image: prom/prometheus:v3.14.0
    container_name: bank-of-decoy-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - onboarding-service
      - account-service
      - pix-key-service
      - transaction-service

  grafana:
    image: grafana/grafana:13.2.0
    container_name: bank-of-decoy-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  postgres_data:
  kafka_data:
  prometheus_data:
  grafana_data:
