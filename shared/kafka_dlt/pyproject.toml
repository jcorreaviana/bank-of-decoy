[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kafka_dlt"
version = "0.1.0"
description = "Tratamento de poison message para consumers Kafka - contador de tentativas via header Kafka e dead-letter topic (DLT) apos limite configuravel (specs/business/22-poison-message-kafka.md, specs/tech/messaging.md). Compartilhado entre os servicos com consumer Kafka."
requires-python = ">=3.12"
dependencies = ["confluent-kafka>=2.3,<3.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["kafka_dlt*"]
