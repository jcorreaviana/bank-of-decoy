[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "risk-engine"
version = "0.1.0"
description = "Regras de classificacao de risco de onboarding e transacao, compartilhadas entre onboarding-service, transaction-service e o populador de volume (specs/business/04-onboarding-risco.md, 06-pixkey-transaction-crud.md, 08-populador-volume.md)."
requires-python = ">=3.12"
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["risk_engine*"]
